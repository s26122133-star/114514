    <title>網頁程式設計作品集 | Web Dev Quest Log</title>
    <!-- Google Fonts: 融入日系微甜與科技感的字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --anime-pink: #ff75a0;
            --anime-purple: #8f71ff;
            --anime-cyan: #40e0d0;
            --anime-gold: #ffcf25;
            --bg-dark: #0f1026;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #0c0d21 0%, #1a1c40 50%, #2a1b3d 100%);
            color: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 櫻花/粒子背景效果 */
        .petal {
            position: absolute;
            background: linear-gradient(135deg, #ffb7c5, #ff69b4);
            border-radius: 150% 0 150% 0;
            opacity: 0.7;
            pointer-events: none;
            animation: animatePetal 10s linear infinite;
        }

        @keyframes animatePetal {
            0% {
                top: -10%;
                transform: translateX(0) rotate(0deg) scale(0.8);
                opacity: 0.8;
            }
            100% {
                top: 105%;
                transform: translateX(100px) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        .avatar-glow {
            position: relative;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--anime-pink), var(--anime-cyan), var(--anime-purple));
            background-size: 200% 200%;
            animation: gradientGlow 4s ease infinite;
            padding: 4px;
        }

        @keyframes gradientGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .avatar-img {
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
